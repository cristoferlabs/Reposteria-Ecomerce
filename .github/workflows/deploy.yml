# Deploy a Namecheap cPanel (Setup Node.js App + Passenger).
# Requisitos previos en cPanel: subdominio, MySQL, app Node creada, SSH activo.

name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Escribe .env sin interpolar secretos en el shell (evita fallos con $,#,",etc.).
      - name: Write build env file
        env:
          PUBLIC_SITE_URL: ${{ secrets.PUBLIC_SITE_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          WHATSAPP_BUSINESS_NUMBER: ${{ secrets.WHATSAPP_BUSINESS_NUMBER }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
          MP_ACCESS_TOKEN: ${{ secrets.MP_ACCESS_TOKEN }}
          MP_PUBLIC_KEY: ${{ secrets.MP_PUBLIC_KEY }}
          MP_WEBHOOK_SECRET: ${{ secrets.MP_WEBHOOK_SECRET }}
        run: |
          python3 <<'PY'
          import os
          keys = [
            "PUBLIC_SITE_URL",
            "SESSION_SECRET",
            "ADMIN_EMAILS",
            "WHATSAPP_BUSINESS_NUMBER",
            "GOOGLE_CLIENT_ID",
            "GOOGLE_CLIENT_SECRET",
            "GOOGLE_REDIRECT_URI",
            "MP_ACCESS_TOKEN",
            "MP_PUBLIC_KEY",
            "MP_WEBHOOK_SECRET",
          ]
          missing = [k for k in keys if not os.environ.get(k)]
          if missing:
            raise SystemExit(f"Missing secrets: {', '.join(missing)}")
          with open(".env", "w", encoding="utf-8") as f:
            for k in keys:
              f.write(f"{k}={os.environ[k]}\n")
          print("Wrote .env with", len(keys), "keys")
          PY

      - name: Build
        run: npm run build

      - name: Upload app to server
        uses: burnett01/rsync-deployments@v8
        with:
          switches: >-
            -az --delete
            --exclude .git
            --exclude .github
            --exclude .env
            --exclude .env.*
            --exclude node_modules
            --exclude .astro
            --exclude assets-originals
            --exclude '*.db'
            --exclude '*.db-journal'
          path: ./
          remote_path: ${{ secrets.DEPLOY_PATH }}/
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}
          remote_port: ${{ secrets.SSH_PORT }}

      - name: Install, migrate, restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: DB_HOST,DB_PORT,DB_USER,DB_PASSWORD,DB_NAME,DEPLOY_PATH
          script: |
            set -e

            APP_ROOT="${DEPLOY_PATH:-}"
            if [ -z "$APP_ROOT" ]; then
              echo "DEPLOY_PATH secret is empty" >&2
              exit 1
            fi
            cd "$APP_ROOT"
            echo "In $APP_ROOT"

            # Prefer Node 22 (Astro 7); fallback a 20 si aún no se actualizó en cPanel.
            ACTIVATE=""
            for ver in 22 20; do
              candidate="$HOME/nodevenv/tienda.mikelvra.com/$ver/bin/activate"
              if [ -f "$candidate" ]; then
                ACTIVATE="$candidate"
                break
              fi
            done
            if [ -z "$ACTIVATE" ]; then
              echo "Missing cPanel nodevenv activate for tienda.mikelvra.com" >&2
              exit 1
            fi
            # shellcheck disable=SC1090
            source "$ACTIVATE"
            echo "Using $(node -v) / npm $(npm -v) via $ACTIVATE"

            if [ -z "${DB_HOST:-}" ] || [ -z "${DB_USER:-}" ] || [ -z "${DB_NAME:-}" ]; then
              echo "DB_* secrets were not passed to the SSH step" >&2
              exit 1
            fi

            # Exportar en el shell (evita que # en la password rompa un .env).
            export DB_HOST DB_PORT DB_USER DB_PASSWORD DB_NAME
            DB_PORT="${DB_PORT:-3306}"

            # CloudLinux exige node_modules como symlink del nodevenv.
            # Si existe un directorio real (p. ej. de un npm ci a mano), SAVE falla.
            if [ -e node_modules ] && [ ! -L node_modules ]; then
              echo "Removing non-symlink node_modules for CloudLinux compatibility"
              rm -rf node_modules
            fi

            # Production en cPanel omite devDeps; hacen falta para migrate.
            npm ci --include=dev
            ./node_modules/.bin/drizzle-kit migrate
            npm prune --omit=dev

            mkdir -p tmp
            touch tmp/restart.txt
            echo "Deploy OK: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
