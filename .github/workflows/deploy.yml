# Deploy a Namecheap cPanel (Setup Node.js App + Passenger).
# Requisitos previos en cPanel: subdominio, MySQL, app Node creada, SSH activo.

name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Escribe .env sin interpolar secretos en el shell (evita fallos con $,#,",etc.).
      - name: Write build env file
        env:
          PUBLIC_SITE_URL: ${{ secrets.PUBLIC_SITE_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          WHATSAPP_BUSINESS_NUMBER: ${{ secrets.WHATSAPP_BUSINESS_NUMBER }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
          MP_ACCESS_TOKEN: ${{ secrets.MP_ACCESS_TOKEN }}
          MP_PUBLIC_KEY: ${{ secrets.MP_PUBLIC_KEY }}
          MP_WEBHOOK_SECRET: ${{ secrets.MP_WEBHOOK_SECRET }}
        run: |
          python3 <<'PY'
          import os
          keys = [
            "PUBLIC_SITE_URL",
            "SESSION_SECRET",
            "ADMIN_EMAILS",
            "WHATSAPP_BUSINESS_NUMBER",
            "GOOGLE_CLIENT_ID",
            "GOOGLE_CLIENT_SECRET",
            "GOOGLE_REDIRECT_URI",
            "MP_ACCESS_TOKEN",
            "MP_PUBLIC_KEY",
            "MP_WEBHOOK_SECRET",
          ]
          missing = [k for k in keys if not os.environ.get(k)]
          if missing:
            raise SystemExit(f"Missing secrets: {', '.join(missing)}")
          with open(".env", "w", encoding="utf-8") as f:
            for k in keys:
              f.write(f"{k}={os.environ[k]}\n")
          print("Wrote .env with", len(keys), "keys")
          PY

      - name: Build
        run: npm run build

      - name: Upload app to server
        uses: burnett01/rsync-deployments@v8
        with:
          switches: >-
            -az --delete
            --exclude .git
            --exclude .github
            --exclude .env
            --exclude .env.*
            --exclude node_modules
            --exclude .astro
            --exclude assets-originals
            --exclude '*.db'
            --exclude '*.db-journal'
          path: ./
          remote_path: ${{ secrets.DEPLOY_PATH }}/
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}
          remote_port: ${{ secrets.SSH_PORT }}

      - name: Install, migrate, restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: DB_HOST,DB_PORT,DB_USER,DB_PASSWORD,DB_NAME,DEPLOY_PATH
          script: |
            set -euo pipefail

            APP_ROOT="${DEPLOY_PATH}"
            if [ -z "$APP_ROOT" ]; then
              echo "DEPLOY_PATH secret is empty" >&2
              exit 1
            fi
            cd "$APP_ROOT"
            echo "In $APP_ROOT"

            # Node de cPanel (Setup Node.js App). Sin esto, no hay node/npm en PATH.
            ACTIVATE="$HOME/nodevenv/tienda.mikelvra.com/20/bin/activate"
            if [ ! -f "$ACTIVATE" ]; then
              echo "Missing activate script: $ACTIVATE" >&2
              exit 1
            fi
            # shellcheck disable=SC1090
            source "$ACTIVATE"
            echo "Using $(node -v) / npm $(npm -v)"

            # drizzle-kit lee process.env / .env (sin espacios de indentación)
            umask 077
            {
              printf 'DB_HOST=%s\n' "$DB_HOST"
              printf 'DB_PORT=%s\n' "$DB_PORT"
              printf 'DB_USER=%s\n' "$DB_USER"
              printf 'DB_PASSWORD=%s\n' "$DB_PASSWORD"
              printf 'DB_NAME=%s\n' "$DB_NAME"
            } > .env

            npm ci
            npx drizzle-kit migrate
            npm prune --omit=dev
            rm -f .env

            mkdir -p tmp
            touch tmp/restart.txt
            echo "Deploy OK: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
